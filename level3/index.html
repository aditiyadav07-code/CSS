<!-- 
absolute units -> px, cm, mm, inch
relative units -> % => width:33% 
               -> % of taking parents width, margin-left:50%
               eg: parent->width=100px & child->width:33% => child->width:33px

               -> em =>changes relative to font-size of parent (can be font-size or width,etc.)
               eg: if parent=> font-size : 10px then child=>font-size:2em = 10*2=20px
               then => width:5em = 20*5=100px;
               some depends on parent font-size and some element

               -> rem => relative to font size of root element(html)

               -> vh => relative to 1% viewport height (browser height)
               -> vw => relative to 1% viewport width (browser width)

by default font-size in body (random/not inside tags) => 16px
-->
